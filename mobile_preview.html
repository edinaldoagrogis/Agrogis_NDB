<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Mobile - GeoPortal NDB</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e1e1e 0%, #2d2d2d 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            perspective: 1000px;
        }

        .presentation-container {
            text-align: center;
            animation: fadeIn 2s ease-out;
        }

        h1 {
            color: #fff;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        p {
            color: #a8b8b0;
            margin-bottom: 40px;
        }

        /* Phone Mockup */
        .phone-frame {
            position: relative;
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            box-shadow: 
                0 0 0 12px #333,
                0 0 0 13px #555,
                0 30px 40px rgba(0,0,0,0.6),
                inset 0 0 20px rgba(255,255,255,0.1);
            margin: 0 auto;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite, tilt-in 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            overflow: hidden;
        }

        /* Notch */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background: #333;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
        }
        
        .notch::before {
            content: '';
            position: absolute;
            top: 10px;
            right: 40px;
            width: 8px;
            height: 8px;
            background: #111;
            border-radius: 50%;
            box-shadow: inset 0 0 2px rgba(255,255,255,0.2);
        }

        /* Inner Screen */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 35px;
            overflow: hidden;
            background: #111;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Allow the iframe to ignore pointer events for the first 3 seconds of animation */
            animation: enable-interaction 3s forwards;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px) rotateX(10deg) rotateY(-5deg); }
            50% { transform: translateY(-20px) rotateX(12deg) rotateY(-3deg); }
            100% { transform: translateY(0px) rotateX(10deg) rotateY(-5deg); }
        }

        @keyframes tilt-in {
            0% {
                opacity: 0;
                transform: translateY(100px) rotateX(30deg) rotateY(-15deg) scale(0.8);
            }
            100% {
                opacity: 1;
                /* Values match the 0% of the float animation to seamlessly loop */
                transform: translateY(0px) rotateX(10deg) rotateY(-5deg) scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes enable-interaction {
            0% { pointer-events: none; }
            99% { pointer-events: none; }
            100% { pointer-events: auto; }
        }

        /* Shine effect over the phone */
        .shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-20deg);
            animation: shine-sweep 4s ease-in-out infinite 2s;
            pointer-events: none;
            z-index: 20;
        }

        @keyframes shine-sweep {
            0% { left: -100%; }
            50% { left: 200%; }
            100% { left: 200%; }
        }

    </style>
</head>
<body>

    <div class="presentation-container">
        <h1>AGROGIS NDB</h1>
        <p>Visão de Aplicativo Mobile</p>

        <div class="phone-frame">
            <div class="notch"></div>
            <div class="shine"></div>
            <div class="screen">
                <!-- Iframe carrega o site ao vivo com URL relativa -->
                <iframe src="./index.html" title="Agrogis Mobile App"></iframe>
            </div>
        </div>
    </div>

</body>
</html>
